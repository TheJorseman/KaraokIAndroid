name: Emulator E2E

# Instrumented tests on a live Android emulator. Manual dispatch only:
# emulator runs are slow (≈20 min) and flaky-prone, so they do not gate
# every push — run before releases or when touching the pipeline,
# Room or the foreground service.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tune Gradle memory for CI runners (7 GB)
        run: |
          echo "org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx1024m" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties

      - name: Fetch whisper.cpp (pinned commit)
        run: |
          git clone --no-checkout https://github.com/ggerganov/whisper.cpp.git third_party/whisper.cpp
          git -C third_party/whisper.cpp fetch --depth 1 origin 48f628a84833905ee4a0658ee6d4a5c915ce1997
          git -C third_party/whisper.cpp checkout --detach 48f628a84833905ee4a0658ee6d4a5c915ce1997

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect
          script: |
            chmod +x ./gradlew
            ./gradlew :feature:separation:connectedDebugAndroidTest --stacktrace
