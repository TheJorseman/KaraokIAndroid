name: Release

# Publishes an APK to GitHub Releases:
#  - push a tag like v1.2.0, or
#  - run manually from the Actions tab (workflow_dispatch).
#
# Signing: when the KEYSTORE_BASE64 secret is set (base64 of the
# release keystore), the release is signed with it (decoded to
# app/dev.keystore, the path the release buildType expects). Without
# the secret the workflow publishes a DEBUG-signed APK so the pipeline
# stays usable out of the box.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tune Gradle memory for CI runners (7 GB)
        run: |
          echo "org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx1024m" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties

      - name: Fetch whisper.cpp (pinned commit)
        run: |
          git clone --no-checkout https://github.com/ggerganov/whisper.cpp.git third_party/whisper.cpp
          git -C third_party/whisper.cpp fetch --depth 1 origin 48f628a84833905ee4a0658ee6d4a5c915ce1997
          git -C third_party/whisper.cpp checkout --detach 48f628a84833905ee4a0658ee6d4a5c915ce1997

      - name: Restore release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/dev.keystore
            echo "release keystore restored"
          else
            echo "no KEYSTORE_BASE64 secret; will publish a debug-signed APK"
          fi

      - name: Build release APK (falls back to debug)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          if [ -f app/dev.keystore ]; then
            ./gradlew :app:assembleRelease 2>&1 | tee build-log.txt
            cp app/build/outputs/apk/release/*.apk karaokei-release.apk
          else
            ./gradlew :app:assembleDebug 2>&1 | tee build-log.txt
            cp app/build/outputs/apk/debug/*.apk karaokei-debug-signed.apk
          fi

      - name: Report failure details
        if: failure()
        run: tail -n 40 build-log.txt 2>/dev/null | sed 's/^/::error::/'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            karaokei-release.apk
            karaokei-debug-signed.apk
