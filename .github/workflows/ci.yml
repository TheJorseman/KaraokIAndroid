name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch whisper.cpp (pinned commit)
        run: |
          git clone --no-checkout https://github.com/ggerganov/whisper.cpp.git third_party/whisper.cpp
          git -C third_party/whisper.cpp fetch --depth 1 origin 48f628a84833905ee4a0658ee6d4a5c915ce1997
          git -C third_party/whisper.cpp checkout --detach 48f628a84833905ee4a0658ee6d4a5c915ce1997

      - name: Tune Gradle memory for CI runners (7 GB)
        run: |
          echo "org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx1024m" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties

      - name: Build and test
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug \
            :core:ai:testDebugUnitTest \
            :core:media:testDebugUnitTest \
            :feature:separation:testDebugUnitTest \
            :feature:karaoke-engine:test --stacktrace 2>&1 | tee build-log.txt

      - name: Report failure details
        if: failure()
        run: |
          {
            echo "## Build failure"
            echo '```'
            tail -n 80 build-log.txt 2>/dev/null || echo "(no log captured)"
            echo '```'
            echo "- free mem: $(free -m | awk '/Mem:/ {print $7}') MB"
            echo "- java: $(java -version 2>&1 | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"
          awk '/^FAILURE:/{f=1} f{print} /^\* Try:/{exit}' build-log.txt > error-block.txt
          if [ -s error-block.txt ]; then
            head -40 error-block.txt | sed 's/^/::error::/'
          else
            tail -n 25 build-log.txt | sed 's/^/::error::/'
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: karaokei-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
